<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE -- reviewer triage web (issue #7)</title>
<style>
  :root {
    --sensitive: #b4232a;
    --safe: #1f7a3f;
    --duplicate: #8a5a00;
    --escalate: #6b3fa0;
    --ink: #1c1c1c;
    --paper: #faf8f3;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0; padding: 0;
    background: #eee; color: var(--ink);
  }
  .banner {
    background: #222; color: #ffd54a; text-align: center;
    font-size: 12px; padding: 4px; letter-spacing: 0.03em;
  }
  #app { max-width: 1000px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 20px; margin: 0 0 4px 0; }
  .sub { color: #555; font-size: 14px; margin-bottom: 18px; }
  .reviewer-row { margin-bottom: 16px; font-size: 13px; }
  .reviewer-row input {
    padding: 4px 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px;
  }
  .progress { font-size: 13px; color: #444; margin-bottom: 14px; }

  .crop {
    background: var(--paper);
    border: 1px solid #d8d2c2;
    border-radius: 4px;
    padding: 10px;
    width: 100%;
    min-height: 90px;
  }
  .crop .line { height: 7px; background: #ddd7c8; border-radius: 2px; margin: 6px 0; }
  .crop .line.short { width: 55%; }
  .crop .highlight {
    display: inline-block;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 12px;
    padding: 3px 6px;
    border-radius: 3px;
    border: 1.5px dashed;
    margin: 4px 0;
  }
  .crop-caption { font-size: 12px; color: #666; margin-bottom: 6px; }

  .guess { font-size: 14px; margin: 12px 0; }

  .disposition-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .disposition-btns button {
    flex: 1; min-width: 140px; padding: 12px; border-radius: 6px; border: 2px solid;
    font-size: 13px; font-weight: 600; cursor: pointer; background: #fff;
  }
  button.sensitive { border-color: var(--sensitive); color: var(--sensitive); }
  button.safe { border-color: var(--safe); color: var(--safe); }
  button.duplicate { border-color: var(--duplicate); color: var(--duplicate); }
  button.escalate { border-color: var(--escalate); color: var(--escalate); }
  button.sensitive.active { background: var(--sensitive); color: #fff; }
  button.safe.active { background: var(--safe); color: #fff; }
  button.duplicate.active { background: var(--duplicate); color: #fff; }
  button.escalate.active { background: var(--escalate); color: #fff; }

  .note-label { display: block; font-size: 12px; color: #555; margin-top: 14px; margin-bottom: 4px; }
  textarea.note {
    width: 100%; font-size: 13px; padding: 8px;
    border: 1px solid #ccc; border-radius: 4px; font-family: inherit; resize: vertical;
  }

  .inbox { display: flex; gap: 16px; }
  .inbox-list { width: 300px; border: 1px solid #ddd; border-radius: 6px; background: #fff; overflow: hidden; }
  .inbox-row {
    padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px;
  }
  .inbox-row:hover { background: #f5f5f5; }
  .inbox-row.selected { background: #eef4ff; }
  .inbox-row .tag {
    display: block; margin-top: 4px; font-size: 12px; font-weight: 600;
  }
  .inbox-detail { flex: 1; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 18px; }

  .all-done {
    margin-top: 16px; padding: 14px; background: #eaf7ee; border: 1px solid #bfe3c9;
    border-radius: 6px; font-size: 14px; color: #1f7a3f;
  }
</style>
</head>
<body>
<div class="banner">PROTOTYPE -- throwaway artifact for issue #7 ("Prototype the human reviewer workflow"). Nothing here writes real files.</div>
<div id="app"></div>

<script>
"use strict";

/* Same underlying finding shape as tools/prototype_reviewer_triage.py's
   load_findings() (residuals + ner_review.findings), but "category" here is
   only ever shown to the reviewer through PLAIN_GUESS below -- the raw
   denylist/PERSON/ORG/etc labels, occurrence counts, and match scores are
   internal fields, not something a reviewer needs to see or judge. */
const FINDINGS = [
  {
    id: "sanitized_document_01:residual:3:denylist",
    category: "denylist",
    shape: "Aaaaa Aaaaa Aaaaaaaaaaa LLC",
    pages: [3],
    crop: "triage/sanitized_document_01/residual_0001_page0003_denylist.png",
  },
  {
    id: "sanitized_document_01:residual:12:address",
    category: "address",
    shape: "999 Aaaaa Aa, Aaaaaaa, XX 99999",
    pages: [12],
    crop: "triage/sanitized_document_01/residual_0002_page0012_address.png",
  },
  {
    id: "sanitized_document_01:ner:PERSON:Aaaa A. Aaaaaaa",
    category: "PERSON",
    shape: "Aaaa A. Aaaaaaa",
    pages: [1, 4, 9],
    crop: "triage/sanitized_document_01/ner/ner_0001_page0001_person.png",
  },
  {
    id: "sanitized_document_01:ner:ORG:Aaaaaaa Aaaaaaaaxx, Aac.",
    category: "ORG",
    shape: "Aaaaaaa Aaaaaaaaxx, Aac.",
    pages: [2, 5],
    crop: "triage/sanitized_document_01/ner/ner_0002_page0002_org.png",
  },
];

/* Plain-language stand-in for the internal category -- a hint, not a code. */
const PLAIN_GUESS = {
  denylist: "matches something we've flagged before",
  address: "looks like an address",
  PERSON: "looks like a person's name",
  ORG: "looks like a company name",
};

const DISPOSITIONS = [
  { key: "sensitive", label: "Yes, this is sensitive" },
  { key: "safe", label: "No, fine to show" },
  { key: "duplicate", label: "We've already flagged this" },
  { key: "escalate", label: "Not sure, ask someone else" },
];

/* In-memory only -- no persistence. Reset on reload by design. */
const state = {
  reviewer: "",
  decisions: {},  // finding id -> disposition key
  notes: {},      // finding id -> optional note text
  selected: FINDINGS[0].id,
};

function decidedCount() {
  return Object.keys(state.decisions).length;
}

function findingById(id) {
  return FINDINGS.find(f => f.id === id);
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function setDisposition(findingId, key) {
  state.decisions[findingId] = key;
  render();
}

function setNote(findingId, text) {
  state.notes[findingId] = text;
}

function cropEl(finding) {
  const div = document.createElement("div");
  div.className = "crop";
  const color = "#555";
  div.innerHTML = `
    <div class="line"></div>
    <div class="line short"></div>
    <span class="highlight" style="border-color:${color};color:${color}">${escapeHtml(finding.shape)}</span>
    <div class="line short"></div>
  `;
  return div;
}

function dispositionButtons(findingId, current) {
  const wrap = document.createElement("div");
  wrap.className = "disposition-btns";
  DISPOSITIONS.forEach(({ key, label }) => {
    const btn = document.createElement("button");
    btn.className = key + (current === key ? " active" : "");
    btn.textContent = label;
    btn.onclick = () => setDisposition(findingId, key);
    wrap.appendChild(btn);
  });
  return wrap;
}

function reviewerRow() {
  const row = document.createElement("div");
  row.className = "reviewer-row";
  row.innerHTML = `Your name: <input id="reviewer-input" type="text" placeholder="e.g. sasha" value="${escapeHtml(state.reviewer)}">`;
  row.querySelector("input").oninput = (e) => { state.reviewer = e.target.value; };
  return row;
}

function render() {
  const root = document.getElementById("app");
  root.innerHTML = "";

  const h = document.createElement("h1");
  h.textContent = "Review flagged items";
  const sub = document.createElement("div");
  sub.className = "sub";
  sub.textContent = "For each item below: should it stay hidden, or is it fine to show?";
  root.appendChild(h);
  root.appendChild(sub);
  root.appendChild(reviewerRow());

  const progress = document.createElement("div");
  progress.className = "progress";
  progress.textContent = `${decidedCount()} of ${FINDINGS.length} reviewed`;
  root.appendChild(progress);

  const inbox = document.createElement("div");
  inbox.className = "inbox";

  const list = document.createElement("div");
  list.className = "inbox-list";
  FINDINGS.forEach(f => {
    const row = document.createElement("div");
    row.className = "inbox-row" + (f.id === state.selected ? " selected" : "");
    const decided = state.decisions[f.id];
    const dispositionLabel = decided ? DISPOSITIONS.find(d => d.key === decided).label : null;
    row.innerHTML = `Page ${f.pages[0]} -- ${PLAIN_GUESS[f.category] || "flagged item"}` +
      (dispositionLabel ? `<span class="tag" style="color:var(--${decided})">${dispositionLabel}</span>` : "");
    row.onclick = () => { state.selected = f.id; render(); };
    list.appendChild(row);
  });
  inbox.appendChild(list);

  const detail = document.createElement("div");
  detail.className = "inbox-detail";
  const finding = findingById(state.selected);
  const caption = document.createElement("div");
  caption.className = "crop-caption";
  caption.textContent = `This is what was found on page ${finding.pages[0]}:`;
  detail.appendChild(caption);
  detail.appendChild(cropEl(finding));

  const guess = document.createElement("div");
  guess.className = "guess";
  guess.innerHTML = `Our best guess: <strong>${PLAIN_GUESS[finding.category] || "flagged item"}</strong>.`;
  detail.appendChild(guess);

  detail.appendChild(dispositionButtons(finding.id, state.decisions[finding.id]));

  const noteLabel = document.createElement("label");
  noteLabel.className = "note-label";
  noteLabel.textContent = "Add a note for the team (optional):";
  detail.appendChild(noteLabel);
  const note = document.createElement("textarea");
  note.className = "note";
  note.rows = 2;
  note.placeholder = "Anything that would help us understand your call...";
  note.value = state.notes[finding.id] || "";
  note.oninput = (e) => setNote(finding.id, e.target.value);
  detail.appendChild(note);

  inbox.appendChild(detail);
  root.appendChild(inbox);

  if (decidedCount() === FINDINGS.length) {
    const done = document.createElement("div");
    done.className = "all-done";
    done.textContent = "You're done reviewing everything in this batch. Thanks!";
    root.appendChild(done);
  }
}

render();
</script>
</body>
</html>
